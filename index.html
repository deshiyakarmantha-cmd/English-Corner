<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Official interactive platform for the English Corner at Sanjanani Literary Festival 2026, hosted at the historic Asgiri Maha Vihara Maha Pirivena in Kandy, Sri Lanka. Featuring English language guides, grammar explorations, literature eras, William Shakespeare retrospectives, and interactive writing and play activities." />
    <meta property="og:title" content="English Corner - Sanjanani Literary Festival 2026" />
    <meta property="og:description" content="Official interactive platform for the English Corner at Sanjanani Literary Festival 2026, hosted at the historic Asgiri Maha Vihara Maha Pirivena in Kandy, Sri Lanka. Featuring English language guides, grammar explorations, literature eras, William Shakespeare retrospectives, and interactive writing and play activities." />
    <meta property="og:type" content="website" />

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="alternate icon" href="./favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Seamless fallback for GitHub Pages root deployment where /src/main.tsx is not transpiled
      window.addEventListener('error', function(e) {
        if (e.target && e.target.tagName === 'SCRIPT' && e.target.src && e.target.src.includes('main.tsx')) {
          var link = document.createElement('link');
          link.rel = 'stylesheet';
          link.crossOrigin = 'anonymous';
          link.href = './assets/index.css';
          document.head.appendChild(link);

          var s = document.createElement('script');
          s.type = 'module';
          s.crossOrigin = 'anonymous';
          s.src = './assets/index.js';
          document.body.appendChild(s);
        }
      }, true);
    </script>
  </head>
  <body class="bg-[#FAF8F5] text-stone-900 antialiased selection:bg-amber-800/20 selection:text-amber-950 font-sans">
    <div id="root"></div>
  </body>
